name: Fix 1.6 Backport Formatting

on:
  push:
    branches:
      - sync/1.6-critical-fixes
    paths:
      - .github/workflows/fix-backport-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/1.6-critical-fixes
          submodules: recursive
          fetch-depth: 0

      - name: Install clang-format 21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-21

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --check
          rm .github/workflows/fix-backport-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format 1.6 critical backports'
          git push origin HEAD:sync/1.6-critical-fixes
