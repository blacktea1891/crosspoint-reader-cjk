name: Build Sticky 1.6 Backport Artifact

on:
  push:
    branches:
      - sync/1.6-critical-fixes
    paths:
      - .github/workflows/build-sticky-backport.yml

permissions:
  contents: write

jobs:
  build-sticky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: sync/1.6-critical-fixes
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.30'
          enable-cache: false

      - name: Install PlatformIO and font dependencies
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U Pillow

      - name: Validate contracts
        run: |
          set -euo pipefail
          python3 scripts/check_cjk_ui_font_charset.py
          python3 scripts/check_audit_security_contracts.py
          python3 scripts/validate_release_contracts.py

      - name: Build Sticky target
        run: |
          set -euo pipefail
          pio run -e sticky | tee sticky-build.log

      - name: Collect and validate artifact
        run: |
          set -euo pipefail
          build_dir='.pio/build/sticky'
          out_dir='sticky-backport-artifact'
          mkdir -p "$out_dir"

          for file in firmware.bin bootloader.bin partitions.bin firmware.elf firmware.map; do
            if [ -f "$build_dir/$file" ]; then
              cp "$build_dir/$file" "$out_dir/$file"
            fi
          done

          test -f "$out_dir/firmware.bin"
          test -f "$out_dir/bootloader.bin"
          test -f "$out_dir/partitions.bin"
          cp partitions.csv "$out_dir/partitions.csv"
          cp sticky-build.log "$out_dir/sticky-build.log"

          firmware_size="$(stat -c %s "$out_dir/firmware.bin")"
          ota_slot_limit=6553600
          echo "$firmware_size" > "$out_dir/firmware-size-bytes.txt"
          if [ "$firmware_size" -gt "$ota_slot_limit" ]; then
            echo "firmware.bin is ${firmware_size} bytes, over OTA slot limit ${ota_slot_limit}" >&2
            exit 1
          fi

          (
            cd "$out_dir"
            sha256sum firmware.bin bootloader.bin partitions.bin > SHA256SUMS
          )

          cat > "$out_dir/README.txt" <<EOF
          CrossPoint Reader CJK - Sticky 1.6 critical-backport test build
          Source branch: sync/1.6-critical-fixes
          Source commit at build start: $GITHUB_SHA
          PlatformIO environment: sticky
          firmware.bin size: ${firmware_size} bytes
          OTA application slot limit checked: ${ota_slot_limit} bytes

          Backports under test:
          - EPUB long footnote href storage + cache invalidation
          - explicit-navigation/deferred-reposition rollback protection
          - KOSync generic 2xx compatibility and HTTP 204 no-progress handling

          This is a test artifact from the feature branch, not a release build.
          EOF

          ls -lh "$out_dir"

      - name: Upload Sticky artifact
        uses: actions/upload-artifact@v6
        with:
          name: CrossPoint-CJK-Sticky-1.6-backport-${{ github.sha }}
          path: sticky-backport-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary workflow from branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/build-sticky-backport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary Sticky backport builder'
          git push origin HEAD:sync/1.6-critical-fixes
